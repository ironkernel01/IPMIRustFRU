[package]
name = "ipmc-emu"
version = "0.1.0"
edition = "2021"

[dependencies]
ipmc-defs = { path = "../ipmc-defs" }
ipmc-core = { path = "../ipmc-core" }
ipmc-ext = { path = "../ipmc-ext" }
ipmc-fru = { path = "../ipmc-fru", features = ["host"] }
ipmc-hal = { path = "../ipmc-hal" }
ipmc-runtime = { path = "../ipmc-runtime", features = ["sim"] }
ipmc-sensors = { path = "../ipmc-sensors" }
ipmc-wire = { path = "../ipmc-wire" }

[dev-dependencies]
# RecordingTrace, the trace collector of the tests.
ipmc-core = { path = "../ipmc-core", features = ["recording"] }
