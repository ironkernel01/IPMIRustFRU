[package]
name = "ipmc-nucleo-f401re"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ipmc-nucleo-f401re"
path = "src/main.rs"

# The bootloader (sectors 0-1) (Documentation/ipmc_boot_plan.md): its own linker script boot.x and the
# profile `boot` (build.rs, gen.ps1).
[[bin]]
name = "ipmc-boot"
path = "src/boot/main.rs"

[workspace]

[dependencies]
cortex-m = { version = "=0.7.10", features = ["critical-section-single-core"] }
# set-vtor and set-sp: the reset handler writes VTOR with the runtime's own table address and
# loads SP from it, so the runtime also starts when a debugger runs it without the bootloader.
cortex-m-rt = { version = "=0.7.7", features = ["set-vtor", "set-sp"] }
heapless = { version = "=0.8.0", default-features = false }
ipmc-app = { path = "../ipmc-app" }
ipmc-boot = { path = "../ipmc-boot" }
ipmc-core = { path = "../ipmc-core" }
ipmc-defs = { path = "../ipmc-defs" }
ipmc-ext = { path = "../ipmc-ext" }
ipmc-fru = { path = "../ipmc-fru" }
ipmc-log = { path = "../ipmc-log" }
ipmc-menu = { path = "../ipmc-menu" }
ipmc-sensors = { path = "../ipmc-sensors", features = ["stm32f401"] }
ipmc-wire = { path = "../ipmc-wire" }
panic-halt = "=1.0.0"
stm32f4 = { version = "=0.16.0", features = ["stm32f401", "rt"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = true

# The bootloader profile: sectors 0-1 hold 32 KB, so size first (design 3.3). Build with
# `cargo build --profile boot --bin ipmc-boot`.
[profile.boot]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = true

[profile.dev.package."*"]
opt-level = "z"

[lints.rust]
# ipmc_eval is set by build.rs for the evaluation build (IPMC_EVAL=1).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ipmc_eval)"] }
